[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "face-inference"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]
license = "MIT"
authors = [{name = "Aman Singh"}]

[project.scripts]
face-inference = "face_inference.cli:main"

[tool.hatch.version]
path = "src/face_inference/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/face_inference/cli.py" = ["E501"]
"src/face_inference/config.py" = ["E501", "I001"]
"src/face_inference/matching.py" = ["E501", "B905"]
"src/face_inference/server.py" = ["E501", "I001", "B904"]
"src/face_inference/service.py" = ["E501", "I001"]
"src/face_inference/storage.py" = ["E501", "I001"]
"tests/test_http.py" = ["E501", "I001"]
"tests/test_service.py" = ["E501", "I001", "B905"]
